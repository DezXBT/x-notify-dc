# x-notify-dc configuration
# Place at /root/x-notify-dc/config.yaml

discord:
  bot_token: "${DISCORD_BOT_TOKEN}"
  default_channel: "1514976399419510865"

twitter:
  cookies:
    - auth_token: "${AUTH_TOKEN}"
      ct0: "${CT0}"
      label: "main"
  health_check_interval: "5m"

tracking:
  poll_interval: "5s"          # Fast polling when active
  idle_poll_interval: "30s"    # Slow polling when idle (5 min no activity)
  idle_threshold: "5m"         # How long before switching to idle mode
  tweets_per_check: 5

logging:
  level: "info"
  timezone: "Asia/Jakarta"
